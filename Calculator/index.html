<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAlpha - Interactive Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="calculator-container">
      <div class="calculator">
        <!-- Screen Display -->
        <div class="display-container">
          <div id="previous-operand" class="previous-operand"></div>
          <div id="current-operand" class="current-operand">0</div>
        </div>

        <!-- Keypad Buttons -->
        <div class="buttons-grid">
          <button class="btn action-btn" data-action="clear">AC</button>
          <button class="btn action-btn" data-action="delete">⌫</button>
          <button class="btn operator-btn" data-operator="%">%</button>
          <button class="btn operator-btn" data-operator="÷">÷</button>

          <button class="btn number-btn" data-number="7">7</button>
          <button class="btn number-btn" data-number="8">8</button>
          <button class="btn number-btn" data-number="9">9</button>
          <button class="btn operator-btn" data-operator="×">×</button>

          <button class="btn number-btn" data-number="4">4</button>
          <button class="btn number-btn" data-number="5">5</button>
          <button class="btn number-btn" data-number="6">6</button>
          <button class="btn operator-btn" data-operator="-">-</button>

          <button class="btn number-btn" data-number="1">1</button>
          <button class="btn number-btn" data-number="2">2</button>
          <button class="btn number-btn" data-number="3">3</button>
          <button class="btn operator-btn" data-operator="+">+</button>

          <button class="btn number-btn zero-btn" data-number="0">0</button>
          <button class="btn number-btn" data-number=".">.</button>
          <button class="btn equals-btn" data-action="calculate">=</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
