<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAlpha - Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="gallery-container">
      <h1>CodeAlpha Image Gallery</h1>
      <p class="subtitle">
        Interactive gallery with category filters, smooth hover effects &
        lightbox view.
      </p>

      <!-- Category Filter Buttons -->
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="architecture">
          Architecture
        </button>
        <button class="filter-btn" data-filter="technology">Technology</button>
      </div>

      <!-- Gallery Grid -->
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
      <span class="close-btn" id="closeBtn">&times;</span>
      <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
      <div class="lightbox-content">
        <img id="lightboxImg" src="" alt="Expanded View" />
        <div id="lightboxCaption" class="lightbox-caption"></div>
      </div>
      <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
